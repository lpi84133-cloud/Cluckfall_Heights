name: cluckfall_heights
description: "Cluckfall Heights - plan vertical storage visually and check how stable it is, fully offline."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State and navigation
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0

  # Local-only persistence. Nothing leaves the device.
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # Profile photo: camera or library, cropped in-app.
  image_picker: ^1.2.3

  # Privacy policy and support pages, rendered from bundled HTML so they work
  # with no connection.
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2

  # Presentation
  audioplayers: ^6.8.1
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  package_info_plus: ^10.2.1
  lucide_icons_flutter: ^3.1.17
  meta: ^1.18.0

  # Install attribution only: tells AppsFlyer's dashboard whether an install
  # was organic or came from a tracked link. No in-app events are logged.
  appsflyer_sdk: ^6.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # Resolution variants live in 2.0x/ and 3.0x/ next to each base file and are
    # picked up automatically.
    - assets/img/objects/
    - assets/img/indicators/
    - assets/img/brand/
    - assets/img/backgrounds/
    - assets/sounds/
    - assets/legal/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: assets/icon/icon_ios.png
  remove_alpha_ios: true
  ios: true
  android: true
  adaptive_icon_background: assets/icon/icon_android_background.png
  adaptive_icon_foreground: assets/icon/icon_android_foreground.png
  # The foreground produced by tools/prepare_assets.py is already sized so the
  # cabinet sits inside the circle every launcher mask contains. Adding the
  # package's default inset on top of that would shrink it needlessly.
  adaptive_icon_foreground_inset: 0
